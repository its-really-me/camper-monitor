readers:
  battery:
    driver: ble                       # 'ble' | 'mock'  — override with BATTERY_DRIVER env var
    protocol: eco                     # 'jbd' (DD-frame) | 'eco' (AA-frame, Eco-Worthy 897A etc.)
    macAddress: "AA:BB:CC:DD:EE:FF"   # BLE MAC of your Eco-worthy BMS
    pollInterval: 15000               # ms

  solar:
    driver: ble                       # 'vedirect' | 'ble' | 'mock'  — override with SOLAR_DRIVER env var
    # VE.Direct (driver: vedirect)
    port: /dev/ttyUSB0
    # Victron BLE (driver: ble)
    macAddress: ""                    # enter value or leave it empty for auto-detection
    advertisementKey: "0123456789abcdef0123456789abcdef"              # 32-char hex from VictronConnect → device → info → advertisement key
    pollInterval: 10000               # ms (mock / ble only — VE.Direct sends ~1 s naturally)

  starter:
    driver: mock
    macAddress: ""
    pollInterval: 30000

server:
  port: 3000

ui:
  language: en                        # 'en' | 'de'
