readers:
  battery:
    driver: ble                       # 'ble' | 'mock'  — override with BATTERY_DRIVER env var
    macAddress: "AA:BB:CC:DD:EE:FF"   # BLE MAC of your Eco-worthy JBD BMS
    pollInterval: 5000                # ms

  solar:
    driver: ble                  # 'vedirect' | 'ble' | 'mock'  — override with SOLAR_DRIVER env var
    # VE.Direct (driver: vedirect)
    port: /dev/ttyUSB0
    # Victron BLE (driver: ble)
    macAddress: ""
    advertisementKey: "fb22965b5e047779a766f9f61c7193c5"              # 32-char hex from VictronConnect → device → info → advertisement key
    pollInterval: 2000                # ms (mock / ble only — VE.Direct sends ~1 s naturally)

  starter:
    driver: mock
    macAddress: ""
    pollInterval: 5000

server:
  port: 3000

ui:
  language: en                        # 'en' | 'de'
